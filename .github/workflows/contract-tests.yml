name: TRISYNORA contract, isolation and real MP4 checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Install real video probe and decoder for P1 integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffprobe
          command -v ffmpeg
          ffmpeg -hide_banner -encoders | grep -q libx264
      - name: Run offline contracts and real MP4 decode tests
        run: python -m unittest discover -s tests -v
      - name: G2 real-MP4 synthetic three-root bridge rehearsal
        run: python tools/bridge_rehearsal.py
# No write permissions, other repo checkouts, secrets or native products.
# FFmpeg is installed in ephemeral CI only to test synthetic, isolated MP4.
