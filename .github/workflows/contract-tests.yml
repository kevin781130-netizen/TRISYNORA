name: TRISYNORA contract and isolation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run local-only conformance and repo boundary tests
        run: python -m unittest discover -s tests -v
# This workflow intentionally has NO write permissions, no external repo checkout,
# no secret usage, no product runtime install, and no hardware claims.
